name: Windows build

on:
  push:
    branches: [main, windows-port-v2]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Unit + integration tests
        shell: pwsh
        run: |
          python -m pytest -q -rfE 2>&1 | Tee-Object -FilePath pytest-output.txt
          $pytestExit = $LASTEXITCODE
          if ($pytestExit -ne 0) {
            Get-Content pytest-output.txt | Select-String -Pattern "^(FAILED|ERROR) |^E  " | Select-Object -First 30 | ForEach-Object { Write-Output "::error title=pytest::$($_.Line)" }
            exit 1
          }

      - name: Self-check from source (real Win32 + real screen)
        shell: pwsh
        run: |
          $env:HEYBUDDY_HOME = "$PWD\selfcheck-source"
          python -m src.main --selfcheck --selfcheck-seconds=6
          $selfcheckExit = $LASTEXITCODE
          if ($selfcheckExit -ne 0) {
            Get-Content selfcheck-source\logs\heybuddy.log -ErrorAction SilentlyContinue | Select-String -Pattern "\[ERROR\]" | Select-Object -Last 5 | ForEach-Object { Write-Output "::error title=source log::$($_.Line)" }
          }
          ./scripts/report-selfcheck.ps1 -ReportPath selfcheck-source\selfcheck\selfcheck.json -Label "source"
          if ($selfcheckExit -ne 0) { exit 1 }

      - name: Build HeyBuddy.exe
        run: pyinstaller --noconfirm heybuddy.spec

      - name: Self-check the built exe
        shell: pwsh
        run: |
          $env:HEYBUDDY_HOME = "$PWD\selfcheck-exe"
          $process = Start-Process -FilePath dist\HeyBuddy.exe -ArgumentList "--selfcheck","--selfcheck-seconds=6" -PassThru -Wait
          ./scripts/report-selfcheck.ps1 -ReportPath selfcheck-exe\selfcheck\selfcheck.json -Label "exe"
          if ($process.ExitCode -ne 0) { exit 1 }

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = Get-Command iscc.exe -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $candidates = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe")
            $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $found) { choco install innosetup -y --no-progress | Out-Null; $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1 }
            $iscc = $found
          } else { $iscc = $iscc.Source }
          & $iscc /Q /DAppVersion=0.3.0 /DSourceExe=..\dist\HeyBuddy.exe installer\heybuddy.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Item dist\HeyBuddy-Setup-0.3.0.exe | ForEach-Object { Write-Output "::notice title=installer::$($_.Name) $([math]::Round($_.Length/1MB,1)) MB" }

      - name: Install silently, self-check the installed copy, uninstall
        shell: pwsh
        timeout-minutes: 10
        run: |
          $setup = Start-Process -FilePath dist\HeyBuddy-Setup-0.3.0.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/TASKS=desktopicon" -PassThru -Wait
          if ($setup.ExitCode -ne 0) { Write-Output "::error title=installer::exit $($setup.ExitCode)"; exit 1 }
          $installed = "$env:LOCALAPPDATA\Programs\HeyBuddy\HeyBuddy.exe"
          $shortcut = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\HeyBuddy\HeyBuddy.lnk"
          if (-not (Test-Path $installed)) { Write-Output "::error title=installer::HeyBuddy.exe not installed"; exit 1 }
          if (-not (Test-Path $shortcut)) { Write-Output "::error title=installer::Start menu shortcut missing"; exit 1 }
          Write-Output "::notice title=installer::installed to $installed with Start menu shortcut"
          $env:HEYBUDDY_HOME = "$PWD\selfcheck-installed"
          $process = Start-Process -FilePath $installed -ArgumentList "--selfcheck","--selfcheck-seconds=4" -PassThru -Wait
          ./scripts/report-selfcheck.ps1 -ReportPath selfcheck-installed\selfcheck\selfcheck.json -Label "installed"
          if ($process.ExitCode -ne 0) { exit 1 }
          $uninstaller = Get-ChildItem "$env:LOCALAPPDATA\Programs\HeyBuddy\unins*.exe" | Select-Object -First 1
          $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -PassThru
          if (-not $uninstall.WaitForExit(120000)) { Write-Output "::error title=uninstaller::timed out after 120 s"; $uninstall | Stop-Process -Force; exit 1 }
          # Inno's uninstaller re-launches itself from %TEMP%; poll for the files to go.
          for ($i = 0; $i -lt 60 -and (Test-Path $installed); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $installed) { Write-Output "::error title=uninstaller::HeyBuddy.exe still present"; exit 1 }
          Write-Output "::notice title=uninstaller::removed cleanly (exit $($uninstall.ExitCode))"

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist\HeyBuddy.exe release\
          Copy-Item README.md, SECURITY.md, LICENSE, THIRD_PARTY_NOTICES.md -Destination release\ -ErrorAction SilentlyContinue
          Compress-Archive -Path release\* -DestinationPath HeyBuddy-windows-x64.zip -Force
          Copy-Item dist\HeyBuddy-Setup-0.3.0.exe .
          $lines = @()
          foreach ($file in @("dist\HeyBuddy.exe", "HeyBuddy-Setup-0.3.0.exe", "HeyBuddy-windows-x64.zip")) {
            $lines += "$((Get-FileHash $file -Algorithm SHA256).Hash)  $(Split-Path $file -Leaf)"
          }
          $lines | Out-File SHA256SUMS.txt -Encoding ascii
          (Get-FileHash dist\HeyBuddy.exe -Algorithm SHA256).Hash | Out-File HeyBuddy.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: HeyBuddy-windows-x64
          path: |
            HeyBuddy-Setup-0.3.0.exe
            HeyBuddy-windows-x64.zip
            SHA256SUMS.txt
            HeyBuddy.exe.sha256

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selfcheck-evidence
          path: |
            selfcheck-source/selfcheck/**
            selfcheck-exe/selfcheck/**
            selfcheck-installed/selfcheck/**
            selfcheck-*/logs/**

      - name: Publish release (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            HeyBuddy-Setup-0.3.0.exe
            HeyBuddy-windows-x64.zip
            SHA256SUMS.txt
            HeyBuddy.exe.sha256

      - name: Publish preview pre-release (windows-port-v2 branch)
        if: github.ref == 'refs/heads/windows-port-v2'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.0-preview
          target_commitish: ${{ github.sha }}
          name: HeyBuddy 0.3.0 preview (Windows x64)
          prerelease: true
          body: |
            Built, installed, self-checked and uninstalled on windows-latest from ${{ github.sha }}.
            Easiest: run HeyBuddy-Setup-0.3.0.exe (per-user, no admin). Portable: unzip and run HeyBuddy.exe.
            Then paste your Cloudflare Worker URL in Settings (see README).
            Unsigned: SmartScreen -> More info -> Run anyway. Verify downloads with SHA256SUMS.txt.
          files: |
            HeyBuddy-Setup-0.3.0.exe
            HeyBuddy-windows-x64.zip
            SHA256SUMS.txt
            HeyBuddy.exe.sha256
            selfcheck-exe/selfcheck/selfcheck.json
            selfcheck-exe/selfcheck/buddy_region_visible.png
            selfcheck-exe/selfcheck/buddy_region_capture_excluded.png
            selfcheck-exe/selfcheck/ink_region_visible.png
            selfcheck-exe/selfcheck/ink_region_capture_excluded.png
            selfcheck-installed/selfcheck/selfcheck.json
