name: Windows build

on:
  push:
    branches: [main, windows-port-v2]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Unit + integration tests
        run: python -m pytest -q

      - name: Self-check from source (real Win32 + real screen)
        shell: pwsh
        run: |
          $env:HEYBUDDY_HOME = "$PWD\selfcheck-source"
          python -m src.main --selfcheck --selfcheck-seconds=6
          $selfcheckExit = $LASTEXITCODE
          if ($selfcheckExit -ne 0) {
            Get-Content selfcheck-source\logs\heybuddy.log -ErrorAction SilentlyContinue | Select-String -Pattern "\[ERROR\]" | Select-Object -Last 5 | ForEach-Object { Write-Output "::error title=source log::$($_.Line)" }
          }
          ./scripts/report-selfcheck.ps1 -ReportPath selfcheck-source\selfcheck\selfcheck.json -Label "source"
          if ($selfcheckExit -ne 0) { exit 1 }

      - name: Build HeyBuddy.exe
        run: pyinstaller --noconfirm heybuddy.spec

      - name: Self-check the built exe
        shell: pwsh
        run: |
          $env:HEYBUDDY_HOME = "$PWD\selfcheck-exe"
          $process = Start-Process -FilePath dist\HeyBuddy.exe -ArgumentList "--selfcheck","--selfcheck-seconds=6" -PassThru -Wait
          ./scripts/report-selfcheck.ps1 -ReportPath selfcheck-exe\selfcheck\selfcheck.json -Label "exe"
          if ($process.ExitCode -ne 0) { exit 1 }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist\HeyBuddy.exe release\
          Copy-Item README.md, SECURITY.md, LICENSE -Destination release\ -ErrorAction SilentlyContinue
          Compress-Archive -Path release\* -DestinationPath HeyBuddy-windows-x64.zip -Force
          (Get-FileHash dist\HeyBuddy.exe -Algorithm SHA256).Hash | Out-File HeyBuddy.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: HeyBuddy-windows-x64
          path: |
            HeyBuddy-windows-x64.zip
            HeyBuddy.exe.sha256

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selfcheck-evidence
          path: |
            selfcheck-source/selfcheck/**
            selfcheck-exe/selfcheck/**
            selfcheck-*/logs/**

      - name: Publish release (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            HeyBuddy-windows-x64.zip
            HeyBuddy.exe.sha256

      - name: Publish preview pre-release (windows-port-v2 branch)
        if: github.ref == 'refs/heads/windows-port-v2'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0-preview
          target_commitish: ${{ github.sha }}
          name: HeyBuddy 0.2.0 preview (Windows x64)
          prerelease: true
          body: |
            Built and self-checked on windows-latest from ${{ github.sha }}.
            Unzip and run HeyBuddy.exe, then paste your Cloudflare Worker URL in Settings.
            Unsigned: SmartScreen -> More info -> Run anyway.
          files: |
            HeyBuddy-windows-x64.zip
            HeyBuddy.exe.sha256
            selfcheck-exe/selfcheck/selfcheck.json
            selfcheck-exe/selfcheck/buddy_region_visible.png
            selfcheck-exe/selfcheck/buddy_region_capture_excluded.png
